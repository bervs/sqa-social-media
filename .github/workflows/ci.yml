name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Testes de unidade do backend ──────────────────────────
      - name: Executar testes JUnit (backend)
        run: cd api && chmod +x mvnw && ./mvnw test
        continue-on-error: true

      # ── Testes de unidade do frontend ─────────────────────────
      - name: Instalar dependencias do frontend
        run: cd client && npm ci

      - name: Executar testes Jest (frontend)
        run: cd client && CI=true npm test

      # ── Subir a aplicacao ─────────────────────────────────────
      - name: Criar .env.local do frontend
        run: echo "NEXT_PUBLIC_BASE_URL=http://localhost:8080" > client/.env.local

      - name: Iniciar API em background
        run: cd api && ./mvnw spring-boot:run -DskipTests > /tmp/api.log 2>&1 &

      - name: Iniciar frontend em background
        run: cd client && npm run dev > /tmp/frontend.log 2>&1 &

      - name: Aguardar API ficar disponivel
        run: |
          echo "Aguardando API..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/posts > /dev/null; do sleep 5; done'
          echo "API pronta!"

      - name: Aguardar Frontend ficar disponivel
        run: |
          echo "Aguardando Frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 5; done'
          echo "Frontend pronto!"

      # ── Testes Playwright ─────────────────────────────────────
      - name: Instalar dependencias dos testes
        run: cd tests && npm ci

      - name: Instalar navegador Playwright
        run: cd tests && npx playwright install --with-deps chromium

      - name: Executar testes Playwright
        run: cd tests && npx playwright test
        continue-on-error: true

      - name: Publicar relatorio Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
